server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.zhuanbaomao.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT配置
jwt:
  secret: ZhuanBaoMao2024SecretKeyForJWTTokenGenerationAndValidation
  expiration: 86400000  # 24小时 (毫秒)
  refresh-expiration: 604800000  # 7天 (毫秒)
  header: Authorization
  token-prefix: "Bearer "

# 应用配置
app:
  upload:
    path: ./uploads/
    allowed-types: jpg,jpeg,png,gif,webp
    max-size: 10485760  # 10MB
  order:
    expire-minutes: 30  # 订单未支付自动取消时间

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/zhuanbaomao?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  # 邮件配置（163邮箱）
  mail:
    host: smtp.163.com
    port: 465
    username: m13229775516_1@163.com
    password: DRhCPdVtUduBqE72
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
